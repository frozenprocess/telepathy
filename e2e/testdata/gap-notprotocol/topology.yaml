# backend serves both TCP/8080 and UDP/8081; frontend probes each protocol.
namespaces:
  - name: demo
    labels: {kubernetes.io/metadata.name: demo}
endpoints:
  - {id: demo/frontend, namespace: demo, name: frontend, ip: 10.0.0.1, labels: {role: frontend}, ports: [{name: http, port: 8080, protocol: tcp}]}
  - id: demo/backend
    namespace: demo
    name: backend
    ip: 10.0.0.2
    labels: {role: backend}
    ports:
      - {name: http,     port: 8080, protocol: tcp}
      - {name: udp-echo, port: 8081, protocol: udp}
port: 8080
protocol: tcp
