assertions:
  - name: frontend (role != other) is admitted
    from: demo/frontend
    to: demo/backend
    expect: allow
  - name: other (role == other) is excluded by the NotIn
    from: demo/other
    to: demo/backend
    expect: deny
  - name: backend as a source is unrestricted
    from: demo/backend
    to: demo/frontend
    expect: allow
