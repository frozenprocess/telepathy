# Workload pods in prod/dev, plus a coredns stand-in (k8s-app=kube-dns) in a
# dns-system namespace the policy excludes — mirroring how the Calico case
# excludes the real kube-system.
namespaces:
  - name: prod
    labels: {kubernetes.io/metadata.name: prod}
  - name: dev
    labels: {kubernetes.io/metadata.name: dev}
  - name: dns-system
    labels: {kubernetes.io/metadata.name: dns-system}
endpoints:
  - {id: prod/frontend, namespace: prod, name: frontend, ip: 10.0.0.1, labels: {role: frontend}, ports: [{name: http, port: 8080, protocol: tcp}]}
  - {id: prod/backend,  namespace: prod, name: backend,  ip: 10.0.0.2, labels: {role: backend},  ports: [{name: http, port: 8080, protocol: tcp}]}
  - {id: dev/frontend,  namespace: dev,  name: frontend, ip: 10.0.0.3, labels: {role: frontend}, ports: [{name: http, port: 8080, protocol: tcp}]}
  - id: dns-system/coredns
    namespace: dns-system
    name: coredns
    ip: 10.0.1.10
    labels: {k8s-app: kube-dns}
    ports:
      - {name: dns, port: 53, protocol: udp}
port: 53
protocol: udp
