# backend serves two ports: 8080 (the excluded one) and 9090 (open). frontend
# probes both.
namespaces:
  - name: demo
    labels: {kubernetes.io/metadata.name: demo}
endpoints:
  - {id: demo/frontend, namespace: demo, name: frontend, ip: 10.0.0.1, labels: {role: frontend}, ports: [{name: http, port: 8080, protocol: tcp}]}
  - id: demo/backend
    namespace: demo
    name: backend
    ip: 10.0.0.2
    labels: {role: backend}
    ports:
      - {name: http, port: 8080, protocol: tcp}
      - {name: alt,  port: 9090, protocol: tcp}
port: 8080
protocol: tcp
